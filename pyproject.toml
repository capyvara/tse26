[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tse-downloader"
version = "0.1.0"
description = "Resumable, indexed downloader for TSE voting-machine files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4"]

[project.scripts]
tse-downloader = "tse_downloader.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tse_downloader"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

